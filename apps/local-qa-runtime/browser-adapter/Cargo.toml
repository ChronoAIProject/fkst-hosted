[package]
name = "fkst-local-qa-browser-adapter"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "fkst_local_qa_browser_adapter"
path = "src/lib.rs"

[dependencies]
futures-channel = "=0.3.33"
headless_chrome = { version = "=1.0.22", default-features = false, features = ["offline"] }
nix = { version = "=0.31.3", features = ["signal"] }
png = "=0.18.1"
serde_json = "=1.0.151"
tempfile = "=3.27.0"
thiserror = "=2.0.19"

[dev-dependencies]
futures-executor = "=0.3.33"

[lints]
workspace = true
