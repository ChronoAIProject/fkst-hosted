[package]
name = "fkst-local-qa-host"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "fkst_local_qa_host"
path = "src/lib.rs"

[[bin]]
name = "fkst-local-qa-host"
path = "src/main.rs"

[features]
default = []
mvp0-browser-test = [
  "dep:fkst-local-qa-browser-adapter",
  "dep:fkst-local-qa-evidence-stager",
  "dep:nix",
]

[dependencies]
ctrlc = { version = "=3.4.7", features = ["termination"] }
fkst-local-qa-browser-adapter = { path = "../browser-adapter", optional = true }
fkst-local-qa-evidence-stager = { path = "../evidence-stager", optional = true }
fkst-qa-contracts = { path = "../../../packages/qa-contracts/rust" }
httparse = "=1.10.1"
nix = { version = "=0.30.1", features = ["signal"], optional = true }
rusqlite = "=0.40.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints]
workspace = true
