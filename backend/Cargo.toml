[package]
name = "fkst-control-plane"
version = "0.2.3"
edition = "2021"
# Single-crate backend (no workspace): edition-2021 packages default to the v2
# feature resolver, pinned explicitly so a future edition bump can't silently
# change resolution.
resolver = "2"

# Two deployables, one crate (the backend is deliberately not a workspace). The
# control plane and the durable audit relay are separate PROCESSES with separate
# module trees; declaring both targets explicitly keeps `cargo build --bins`
# honest about what ships.
[[bin]]
name = "fkst-control-plane"
path = "src/main.rs"

[[bin]]
name = "fkst-audit-relay"
path = "src/bin/audit_relay.rs"

[dependencies]
async-trait = "0.1"
axum = "0.7"
# Runtime OpenAPI 3 generation for the public HTTP surface, served at
# /openapi.json (no static spec; the live route table IS the spec). `utoipa`
# carries the `#[utoipa::path]`/`ToSchema`/`IntoParams` derives; `utoipa-axum`'s
# `OpenApiRouter` collects paths+schemas from the routes as they are registered,
# so the documented path and the axum route are one and the same. `utoipa-axum`
# 0.1 targets axum 0.7 (0.2+ moved to axum 0.8); both track utoipa 5.
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "process", "time", "sync", "io-util", "io-std", "fs"] }
tokio-util = "0.7"
# Wraps the chat orchestrator's mpsc receiver as a `Stream` for axum's SSE
# response (`ReceiverStream`).
tokio-stream = "0.1"
# `util` carries `ServiceExt::oneshot`, which the chat tool layer uses to drive
# this process's own router in-process (previously a dev-only need).
tower = { version = "0.5", features = ["util"] }
# No `request-id`: the audit middleware owns `X-Request-Id` end to end (accept a
# well-formed client value, replace anything else, echo the normalized id), so a
# second set/propagate layer would only be able to disagree with it.
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "util"] }
# Collects the body of a router-dispatched response (chat tool results).
http-body-util = "0.1"
# Percent-encodes dynamic path segments and query values in the URLs the chat
# tool layer builds from model-supplied arguments, so a value containing a space
# or a slash cannot escape its segment. Already in the tree via reqwest/url.
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
# Namespace-independent environment profiles are stored as one AES-256-GCM
# envelope per record. The key is delivered by the external secret provider;
# only nonce + ciphertext are persisted in Kubernetes.
aes-gcm = "0.10"
# Explicit because decoded key bytes are wiped after initializing AES-GCM.
zeroize = "1"
# Webhook signature verification (issue #108): HMAC-SHA256 over the raw GitHub
# webhook body, constant-time compared against `X-Hub-Signature-256`. `hmac`
# pairs with the already-present `sha2` (no GitHub SDK — consistent with the
# hand-rolled `reqwest` + `jsonwebtoken` GitHub App transport).
hmac = "0.12"
# `bson` is a standalone crate (NOT the mongodb driver, removed in #143). It is
# kept for `SessionDoc`'s value types (`bson::Uuid` / `bson::DateTime`) and the
# in-memory `SessionRepo` CAS round-trip (`bson::to_document`).
bson = "2"
regex = "1"
# Multi-pattern substring search for the session log-stream redactor: one
# automaton scans every known-secret plaintext (and its base64/base64url/
# percent-encoded/URL-composed derived forms) over each log line in a single pass,
# so exact-secret redaction stays linear regardless of how many secrets a session
# injects. `regex` (already present) covers the pattern-denylist + entropy layers.
aho-corasick = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
envy = "0.4"
tempfile = "3"
nix = { version = "0.29", features = ["signal", "process"] }
# `stream` powers `Response::bytes_stream()`, which the chat concierge's LLM
# client reads the provider's SSE body from incrementally (a buffered read would
# defeat streaming answers to the browser).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
secrecy = "0.10"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
once_cell = "1"
# `rand` (0.8) sources cryptographic randomness for the GitHub App JWT/runtime
# nonces and the per-write environment-profile AES-GCM nonce.
rand = "0.8"
# Deterministic per-session ids (UUIDv5 over installation+repo+issue) so a
# webhook redelivery maps to the same session/Job (at-most-one-Job idempotency),
# the same v5 derivation for a terminal audit record's dedupe id, and v4 for the
# generated `X-Request-Id` the audit middleware substitutes for a missing or
# malformed client value.
uuid = { version = "1", features = ["v4", "v5"] }
# Stream combinators for the kube-runtime Job watch.
futures = "0.3"
# Kubernetes client for spawning one Job per substrate session (milestone #9).
# rustls (no openssl), matching the reqwest rustls-tls stack.
# `ws` enables `Api::exec` (pods/exec over websocket) for the engine-observe verb.
kube = { version = "0.96", default-features = false, features = ["client", "config", "runtime", "rustls-tls", "ws"] }
k8s-openapi = { version = "0.23", features = ["latest"] }
# `zip` unpacks Ornn skill packages into the per-session CODEX_HOME (engine).
zip = { version = "2", default-features = false, features = ["deflate"] }
# The in-pod log collector bundles the redacted log tree into a single
# `tar.gz` before uploading it to chrono-storage. `tar` builds the archive and
# `flate2` gzip-compresses it (both are widely-used, well-maintained crates;
# `flate2` was already present transitively).
tar = { version = "0.4", default-features = false }
flate2 = "1"
# The durable audit relay's outbox (issue #5678). SQLite is the spec-mandated
# store: one writer, WAL, `synchronous=FULL`, on the relay's own PVC. `bundled`
# compiles SQLite from source so the deployable needs no system libsqlite3 and
# the pinned version is a property of the build rather than of the base image.
# Linked into the single crate; only the `fkst-audit-relay` binary opens a
# database.
rusqlite = { version = "0.32", features = ["bundled"] }
# Constant-time byte comparison for the relay's write/read bearer tokens. Already
# in the tree via aes-gcm; named explicitly because a hand-rolled comparison is
# exactly the kind of primitive that must not be reinvented.
subtle = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"
filetime = "0.2"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
