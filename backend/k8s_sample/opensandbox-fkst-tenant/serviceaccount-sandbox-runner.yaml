# The UNBOUND identity every fkst sandbox pod runs as (the server config's
# `[kubernetes].service_account`). Mirrors the chrono tenant: no RoleBindings, no
# IAM annotation, and `automountServiceAccountToken: false` — a sandbox holds NO
# k8s or GCP ambient authority. The batchsandbox template ALSO sets
# `automountServiceAccountToken: false` at the pod level (defense in depth).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-runner
  namespace: chronoai-fkst-sandbox
  labels:
    app.kubernetes.io/name: sandbox-runner
    app.kubernetes.io/part-of: fkst-hosted
automountServiceAccountToken: false
