# GKE Secrets Store CSI mapping for the fkst-hosted BACKEND's two OpenSandbox
# secrets (namespace chronoai-fkst — SecretProviderClass is namespace-local).
# Pairs with backend-deployment-patch.yaml, which mounts this class at
# /var/secrets and points FKST_OSB_API_KEY_FILE / FKST_OSB_EXECD_TOKEN_SEED_FILE
# at the two paths.
#
# IAM prerequisite: the backend's KSA (fkst-control-plane) needs
# roles/secretmanager.secretAccessor on BOTH secrets via GKE Workload Identity
# Federation — see README.md for the principal:// syntax.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: fkst-osb-secrets
  namespace: chronoai-fkst
  labels:
    app.kubernetes.io/part-of: fkst-hosted
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/chronoai-501608/secrets/opensandbox-fkst-api-key/versions/latest"
        path: "opensandbox-fkst-api-key"
      - resourceName: "projects/chronoai-501608/secrets/fkst-osb-execd-token-seed/versions/latest"
        path: "fkst-osb-execd-token-seed"
