# config.toml for the DEDICATED fkst OpenSandbox server instance
# (`opensandbox-server-fkst` in `opensandbox-system`) — mounted from a ConfigMap
# exactly like the existing chrono instance's `opensandbox-server-config`.
# Values verified against the deployed server v0.2.1 contract; see README.md.

[server]
host = "0.0.0.0"
port = 80
# Real value via the OPENSANDBOX_SERVER_API_KEY env override — the container
# command wraps: export OPENSANDBOX_SERVER_API_KEY=$(cat /var/secrets/opensandbox-fkst-api-key)
# (CSI-mounted from GCP SM `opensandbox-fkst-api-key`). NEVER inline a key here.
api_key = ""
# Binds ONLY requests that SET a timeout (fkst's env-validation holder sandboxes,
# which use `validate_deadline_secs + 120`); fkst SESSION sandboxes create with
# `timeout: null` (no auto-expiry — explicit delete + the fleet reaper own their
# lifecycle), which bypasses this cap by design (validators.py returns early on
# null). Keep >= the validation holder TTL.
max_sandbox_timeout_seconds = 3600

[log]
level = "INFO"

[runtime]
type = "kubernetes"
# Keep in lockstep with the chrono instance (one execd contract cluster-wide).
execd_image = "opensandbox/execd:v1.0.20"

[kubernetes]
# THE tenant boundary: every sandbox this instance creates lands here. The
# fkst-hosted backend never chooses a namespace (the create API has none).
namespace = "chronoai-fkst-sandbox"
service_account = "sandbox-runner"
workload_provider = "batchsandbox"
batchsandbox_template_file = "/etc/opensandbox/batchsandbox-template.yaml"
# Scale-from-zero pool headroom: node boot + image pull can take 1-3 min. The
# server holds the synchronous create open this long; the fkst client's create
# budget (330s) is sized to this value + slack — bump BOTH together.
sandbox_create_timeout_seconds = 300
informer_enabled = true
informer_resync_seconds = 300
informer_watch_timeout_seconds = 60

# gVisor: injects runtimeClassName into every sandbox pod (the RuntimeClass
# carries the nodeSelector + toleration). The batchsandbox template repeats the
# selector/toleration as a second guarantee.
[secure_runtime]
type = "gvisor"
k8s_runtime_class = "gvisor"

[ingress]
mode = "direct"
