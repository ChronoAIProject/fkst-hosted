# FRAGMENT (strategic-merge patch) for the fkst-hosted control-plane Deployment
# in chronoai-fkst: mounts the CSI-delivered OpenSandbox secrets (see
# secretproviderclass-backend.yaml) and points the backend at them + at the
# DEDICATED fkst server instance. The *_FILE vars are non-secret (paths) and a
# *_FILE var wins over its inline twin; file contents are trimmed; an
# unreadable/empty file fails closed at startup (backend/src/osb_config.rs).
#
# Merge into the base Deployment (backend/k8s_sample/deployment.yaml) alongside
# FKST_POD_MODE=opensandbox and the rest of the FKST_OSB_* ConfigMap block.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fkst-control-plane
  namespace: chronoai-fkst
spec:
  template:
    spec:
      containers:
        - name: fkst-control-plane
          env:
            - name: FKST_OSB_BASE_URL
              # In-cluster ClusterIP of the DEDICATED fkst instance. NOT the
              # public proxy-fronted URL: creates block up to 300s server-side
              # (spot cold start) while the public proxy times out at ~60s.
              value: "http://opensandbox-server-fkst.opensandbox-system.svc.cluster.local"
            - name: FKST_OSB_API_KEY_FILE
              value: "/var/secrets/opensandbox-fkst-api-key"
            - name: FKST_OSB_EXECD_TOKEN_SEED_FILE
              value: "/var/secrets/fkst-osb-execd-token-seed"
          volumeMounts:
            - name: fkst-osb-secrets
              mountPath: /var/secrets
              readOnly: true
      volumes:
        - name: fkst-osb-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: fkst-osb-secrets
