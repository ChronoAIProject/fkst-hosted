# TEMPLATE ONLY — placeholders, never real credentials.
#
# Deliberately NOT listed in kustomization.yaml, so `kubectl apply -k` can never
# overwrite a real Secret with these placeholders. The control-plane Secret holds
# the (optional) GitHub App credentials and the (optional) static LLM API key.
#
# Create the real Secret BEFORE `apply -k` (preferred — nothing touches disk):
#   kubectl -n <ns> create secret generic fkst-control-plane-secret \
#     --from-literal=FKST_GITHUB_APP_ID="123456" \
#     --from-literal=FKST_GITHUB_APP_WEBHOOK_SECRET="$(openssl rand -hex 32)" \
#     --from-file=FKST_GITHUB_APP_PRIVATE_KEY_PEM=/path/to/app-private-key.pem
#
# Without the GitHub App the control plane still runs (read/stop API, health,
# /openapi.json), but the webhook trigger + Job watcher are NOT mounted, so no
# session can be auto-triggered. An empty Secret is fine until you add the App.
apiVersion: v1
kind: Secret
metadata:
  name: fkst-control-plane-secret
  labels:
    app.kubernetes.io/name: fkst-control-plane
    app.kubernetes.io/part-of: fkst-hosted
type: Opaque
stringData:
  # --- LLM provider API key (the engine's codex credential) ---
  # The static key each session's engine authenticates with. REQUIRED (non-blank)
  # when FKST_POD_DISPATCH=true; written into the per-session Secret and read by
  # the engine under LLM_API_KEY. The model/base URL/wire_api are non-secret
  # config (see configmap.yaml).
  # FKST_LLM_API_KEY: "CHANGE_ME"

  # --- OpenSandbox backend secrets (only when FKST_POD_MODE=opensandbox) ---
  # REQUIRED (non-blank) when FKST_POD_DISPATCH=true AND FKST_POD_MODE=opensandbox.
  # The non-secret FKST_OSB_* knobs (base URL / cpu / memory / entrypoint / …) live
  # in configmap.yaml; these two are SECRETS and must never appear there.
  # The OpenSandbox lifecycle API key (OPEN-SANDBOX-API-KEY header):
  # FKST_OSB_API_KEY: "CHANGE_ME"
  # The long-lived seed the per-session execd access token is derived from (HMAC):
  # FKST_OSB_EXECD_TOKEN_SEED: "CHANGE_ME"

  # --- GitHub App (enables the webhook trigger + Job watcher) ---
  # FKST_GITHUB_APP_ID: "CHANGE_ME"
  # FKST_GITHUB_APP_SLUG: "fkst-hosted"
  # Inline PEM with literal \n escapes (mutually exclusive with _PRIVATE_KEY_PATH):
  # FKST_GITHUB_APP_PRIVATE_KEY_PEM: "-----BEGIN RSA PRIVATE KEY-----\nCHANGE_ME\n-----END RSA PRIVATE KEY-----"
  # Webhook HMAC secret (without it the webhook route is not mounted):
  # FKST_GITHUB_APP_WEBHOOK_SECRET: "CHANGE_ME"

  # --- chrono-storage log streaming (OPTIONAL) ---
  # The NyxID READ/responder SA client secret used to mint the OAuth2
  # client-credentials token for chrono-storage. Pairs with the non-secret
  # FKST_STORAGE_* / FKST_NYXID_CLIENT_ID / FKST_NYXID_TOKEN_URL in
  # configmap.yaml. Leave the whole set unset to keep log streaming disabled.
  # FKST_NYXID_CLIENT_SECRET: "CHANGE_ME"

  # The WRITE-ONLY SA client secret injected into every session Secret so the
  # in-pod uploader can PUT its log bundle (scope: storage-write — never read/
  # list/delete). Pairs with the non-secret FKST_STORAGE_WRITER_CLIENT_ID in
  # configmap.yaml. Leave both unset to disable per-session bundle uploads.
  # FKST_STORAGE_WRITER_CLIENT_SECRET: "CHANGE_ME"
