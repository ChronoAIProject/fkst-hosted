# RBAC for OPENSANDBOX-mode execution (FKST_POD_MODE=opensandbox). This file is
# the opensandbox-mode counterpart of rbac.yaml — apply EXACTLY ONE of the two,
# matching FKST_POD_MODE (see README "Choosing an RBAC posture"):
#   * rbac.yaml             -> k8s-customized mode: the FULL pod-launcher surface;
#                              the control plane creates/watches/GCs one session Pod
#                              (+ per-session Secret + env-validation Pod) per
#                              session, in its own namespace.
#   * rbac-opensandbox.yaml -> opensandbox mode (THIS FILE): the control plane runs
#                              NO session Pods, so it is granted ZERO pod RBAC. The
#                              session-runtime authority now lives with the
#                              OpenSandbox server's OWN ServiceAccount, which is
#                              infra-owned and NOT part of this repo.
#
# WHY secrets + configmaps RBAC still remains here: the per-user named-environment
# store (backend/src/k8s/env_store.rs) persists each GitHub user's environments as
# a paired `fkst-env-<id>-<name>` ConfigMap (install commands + non-secret
# variables) + Secret (secret values) in the CONTROL-PLANE namespace. That is
# control-plane STATE STORAGE, not session-runtime interaction, so it is required
# in BOTH modes — stripping it would break environment CRUD. The verbs below are
# the LEAST-PRIVILEGE set the store actually uses (audited in env_store.rs):
# create / get / list / update(=`.replace()`) / delete. The store never watches
# and never patches (it does a full `.replace()`, never `.patch()`), so `watch`
# and `patch` are DELIBERATELY absent.
#
# ZERO pod RBAC is INTENTIONAL, not an omission: opensandbox mode exists precisely
# because the infra team WITHHOLDS pod-launch authority from the control plane. Do
# NOT add any Pod-surface RBAC rules here — Pod create/get/list/watch/delete, nor
# the Pod log/status subresources (the rules rbac.yaml carries) — that would defeat
# the whole posture. All objects are namespace-agnostic; kustomize sets the namespace.
---
# The control plane runs as this ServiceAccount (Deployment serviceAccountName).
# `fkst-session-runner` from rbac.yaml is intentionally ABSENT: opensandbox mode
# runs no in-cluster session Pods, so fkst needs no runner SA — the sandbox's
# ServiceAccount is defined by the infra-owned OpenSandbox tenant template.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fkst-control-plane
  labels:
    app.kubernetes.io/name: fkst-control-plane
    app.kubernetes.io/part-of: fkst-hosted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fkst-control-plane-envstore
  labels:
    app.kubernetes.io/part-of: fkst-hosted
rules:
  # Named-environment store — secret values: one `fkst-env-<id>-<name>` Secret per
  # environment, one data key per secret KEY, created/read/listed/replaced/deleted
  # via the GitHub-token environments API. No `watch`/`patch` (see header).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "update", "delete"]
  # Named-environment store — install commands + non-secret variables: one
  # `fkst-env-<id>-<name>` ConfigMap per environment, same lifecycle, same
  # least-privilege verb set.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fkst-control-plane-envstore
  labels:
    app.kubernetes.io/part-of: fkst-hosted
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fkst-control-plane-envstore
subjects:
  - kind: ServiceAccount
    name: fkst-control-plane
