# Non-secret runtime config for the control plane — SAMPLE values.
# Canonical source of truth: backend/src/config.rs (+ github_app/config.rs).
#
# Image-baked (do NOT set here): FKST_HOSTED_PORT=8080, FKST_HOSTED_BIND_ADDR=0.0.0.0.
# Downward-API (set in the Deployment, not here): FKST_POD_ID (metadata.name),
# FKST_POD_NAMESPACE (metadata.namespace) — session Jobs land in the control
# plane's own namespace.
# Secret keys live in secret.example.yaml (fkst-control-plane-secret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: fkst-control-plane-config
  labels:
    app.kubernetes.io/name: fkst-control-plane
    app.kubernetes.io/part-of: fkst-hosted
data:
  # --- HTTP / server ---
  FKST_HOSTED_LOG_LEVEL: "info,fkst_control_plane=debug,tower_http=info"
  FKST_HOSTED_REQUEST_TIMEOUT_SECS: "30" # >= 1

  # The session read/stop API is open, read-only, and network-isolated — there
  # is no application-level auth to configure. The only authenticated inbound is
  # the signature-verified GitHub App webhook (secret in secret.example.yaml).

  # --- LLM provider (config-driven; injected into each session pod) ---
  # The model/base URL/wire_api are injected as plain pod env (session pods do
  # NOT inherit this ConfigMap). FKST_LLM_API_KEY is a Secret (see
  # secret.example.yaml) and is REQUIRED when FKST_POD_DISPATCH=true.
  FKST_LLM_MODEL: "gpt-5.5" # non-blank (fail-closed)
  FKST_LLM_BASE_URL: "https://llm.aelf.dev/v1"  # PUBLIC: the isolated session pod reaches the LLM over the internet, never in-cluster (#338 R3)
  # codex wire_api. "responses" is correct for llm.aelf.dev (verified) and is
  # the code default — codex 0.139+ dropped wire_api="chat" (errors at config
  # load); set "chat" ONLY for a chat-only backend. Non-blank (fail-closed).
  FKST_LLM_WIRE_API: "responses"

  # --- Session trigger ---
  # Only a GitHub issues.opened carrying this label auto-triggers a session.
  FKST_WEBHOOK_TRIGGER_LABEL: "fkst"

  # Auto-seed a trigger issue when the App is installed on a repo (writes to the
  # user's repo, so opt-in). "true" seeds session=evolve, the github-devloop-workflow
  # package, work label fkst-evolve, auto-merge on, log access = repo owner;
  # idempotent + best-effort. Default false.
  # FKST_SEED_TRIGGER_ISSUE_ON_INSTALL: "false"

  # --- Deployment-wide access allowlist (OPTIONAL) ---
  # Comma-separated GitHub numeric ids and/or logins. Unset = open. Set = only
  # these identities pass the token-authenticated APIs, and only their trigger
  # issues spawn sessions (unlisted users get 403 / are ignored; removal tears
  # their sessions down on the next reconcile). Ids preferred (rename-stable).
  # FKST_ACCESS_ALLOWED_USERS: "583231,@your-github-login"

  # --- Pod-per-session dispatch (one K8s Job per substrate session) ---
  # FKST_POD_IMAGE is the SAME image this control plane runs; the session Job
  # re-execs it in `run-session` mode. Keep it in lockstep with the Deployment's
  # image (kustomization.yaml `images:`).
  FKST_POD_DISPATCH: "true"
  # Session-execution backend. Default value is "k8s-customized" (one K8s Job per
  # session). "opensandbox" (one OpenSandbox sandbox per session) is available; when
  # selected it REQUIRES the FKST_OSB_* block below (+ the two FKST_OSB_* Secrets in
  # secret.example.yaml). Missing/invalid FKST_OSB_* vars fail closed at startup.
  # Leave unset for the default.
  # FKST_POD_MODE: "k8s-customized"
  FKST_POD_IMAGE: "fkst-control-plane:dev"
  # Operator-default engine rate pools, injected into EVERY session as
  # FKST_RATE_POOL_<NAME>=<burst>,<refill_per_minute>. The engine throttles
  # matching external commands (`gh`, `git`, ... — including calls the codex
  # coding agent makes, via its PATH shims), protecting the shared GitHub App
  # installation API budget. Space-separated NAME=<burst>,<refill> tokens; NAME
  # is uppercase [A-Z0-9_]+ (not ROOT) and matches the throttled program's
  # basename case-insensitively. Unset = no pools (the pre-knob behavior).
  # FKST_POD_RATE_POOLS: "GH=50,50 GIT=120,120"

  # --- OpenSandbox backend (only when FKST_POD_MODE=opensandbox) ---
  # These non-secret knobs are validated only in opensandbox mode; the two secrets
  # (FKST_OSB_API_KEY, FKST_OSB_EXECD_TOKEN_SEED) are in secret.example.yaml — NEVER
  # here. Production delivers them as CSI-mounted files instead: set the non-secret
  # FKST_OSB_API_KEY_FILE / FKST_OSB_EXECD_TOKEN_SEED_FILE vars (safe HERE — they
  # are paths, not secrets) to the mount paths; a *_FILE var wins over its inline
  # twin, contents are trimmed, unreadable/empty files fail closed.
  # FKST_POD_IMAGE + FKST_POD_NAMESPACE still apply in opensandbox mode; the
  # other FKST_POD_* knobs (service account / DNS / runtime class / termination grace)
  # are IGNORED (the sandbox template owns them) and warned about at startup if set.
  # FKST_OSB_API_KEY_FILE: "/var/secrets/opensandbox-fkst-api-key"
  # FKST_OSB_EXECD_TOKEN_SEED_FILE: "/var/secrets/fkst-osb-execd-token-seed"
  # In-cluster ClusterIP of the fkst tenant's OpenSandbox server (see
  # opensandbox-fkst-tenant/). Do NOT use the public proxy-fronted URL: creates
  # block up to 300s server-side (spot cold start); the public proxy 504s at ~60s.
  # FKST_OSB_BASE_URL: "http://opensandbox-server-fkst.opensandbox-system.svc.cluster.local"
  # FKST_OSB_SESSION_CPU: "500m"      # sandbox resourceLimits.cpu (non-blank)
  # FKST_OSB_SESSION_MEMORY: "512Mi"  # sandbox resourceLimits.memory (non-blank)
  # FKST_OSB_ENTRYPOINT: "/usr/local/bin/fkst-control-plane" # absolute path
  # FKST_OSB_USE_SERVER_PROXY: "true" # only "true" is supported ("false" fails closed)
  # FKST_OSB_INSPECT_HEALTH: "false"  # reserved toggle; no behaviour reads it yet
  FKST_POD_SERVICE_ACCOUNT: "fkst-session-runner"
  FKST_POD_RUN_TTL_SECS: "600" # ttlSecondsAfterFinished; > 0
  FKST_POD_ACTIVE_DEADLINE_SECS: "7200" # activeDeadlineSeconds; > 0
  # Sandbox runtime for session + validation pods. Empty = runc (the cluster
  # default; fine for local/docker-desktop). Set to your Kata RuntimeClass name
  # in prod (nodes must have the Kata runtime installed + nested virtualization).
  # FKST_POD_RUNTIME_CLASS: "kata"

  # --- chrono-storage log streaming (OPTIONAL) ---
  # Stream every session's redacted logs to chrono-storage (a MinIO/S3 front
  # behind the NyxID proxy) as a tar.gz bundle. OPTIONAL: leave ALL of these (+
  # the FKST_NYXID_CLIENT_SECRET Secret, see secret.example.yaml) unset and no
  # bundle is produced. Setting SOME but not all of the core five fails closed at
  # startup, naming the missing vars. These four are non-secret; the client
  # secret is a Secret. The single NyxID SA serves both the control plane's own
  # storage calls (log downloads) AND — injected per session — the in-pod log
  # uploader.
  # FKST_STORAGE_BASE_URL: "https://storage.chrono-ai.fun"
  # FKST_STORAGE_BUCKET: "fkst-session-logs"
  # FKST_NYXID_TOKEN_URL: "https://nyx.chrono-ai.fun/oauth/token"
  # FKST_NYXID_CLIENT_ID: "CHANGE_ME"        # the SA client id
