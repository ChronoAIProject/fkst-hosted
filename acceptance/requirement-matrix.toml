# Requirement-to-test matrix for milestone #22 (epic #5665, gate issue #5683).
#
# This file is the machine-readable half of the milestone closure gate. Every
# normative requirement id in the epic's requirement table appears exactly once
# in `requirement`, and every one of them is mapped to at least one NAMED
# automated test in `evidence`.
#
# `backend/tests/acceptance_matrix.rs` is the linter. It fails CI when a
# requirement is unmapped, when an evidence row names a suite or a test that
# does not exist, when the same test is claimed under two contradictory
# statuses, or when a gated row forgets to say which environment variable gates
# it. It also renders the evidence artifact that accompanies the milestone.
#
# ## Why a data file rather than a doc comment
#
# The traceability claim has to be checkable by a machine, or it decays into a
# prose table nobody reruns. Keeping it as data means the linter can prove the
# named tests still exist after a rename, and the report artifact is generated
# from the same source the gate reads.
#
# ## Fields
#
#   requirement  the epic requirement id, e.g. "AUTH-03"
#   tier         "pr"          deterministic, runs on every pull request
#                "integration" disposable cluster / built containers
#                "staging"     self-hosted PostHog staging smoke
#   suite        repository-relative path of the file that OWNS the test
#   test         the test's exact name inside that file
#   status       "verified"  the named test runs and passes in the tier's CI
#                "gated"     the named test is environment-gated and SKIPS with
#                            an explicit reason when `gate_env` is unset
#   gate_env     required for "gated", forbidden for "verified"
#
# ## Deterministic identities
#
# The cross-user matrix uses fixed identities across every layer. The backend
# harness names two of them after their ROLE rather than their first name; the
# mapping is fixed and is asserted by the linter's identity check:
#
#   Alice  creator                  operations_harness::ALICE
#   Bob    collaborator             operations_harness::BOB
#   Carol  log-access grantee       operations_harness::CAROL
#   Dana   legacy log admin         operations_harness::DANA
#   Erin   unrelated                operations_harness::ERIN
#   Frank  repo admin, no tier      operations_harness::REPO_ADMIN
#   Grace  global admin             operations_harness::ROOT

