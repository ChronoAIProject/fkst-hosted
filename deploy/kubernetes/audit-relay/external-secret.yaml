# Credential binding for the durable audit relay.
#
# The relay is the ONLY workload that holds the PostHog capture (write) token, so
# it gets its own remote record rather than sharing the control plane's. That
# separation is the whole point: the control plane can query history and talk to
# the relay without ever being able to forge a capture into the project.
#
# Remote record `fkst-audit-relay` -> Secret `chronoai-fkst/fkst-audit-relay-secret`
#
# | Property                        | Why the relay needs it                        |
# |---------------------------------|-----------------------------------------------|
# | FKST_AUDIT_RELAY_WRITE_TOKEN    | admits records from the control plane          |
# | FKST_AUDIT_RELAY_READ_TOKEN     | admits the control plane's scoped backlog read |
# | FKST_POSTHOG_PROJECT_TOKEN      | PostHog capture; nothing else may hold it      |
# | FKST_POSTHOG_QUERY_API_KEY      | Query-Read-only key used to VERIFY visibility  |
#
# The write and read tokens must be DIFFERENT values; the relay refuses to start
# otherwise, because one value would silently promote a low-value ingestion
# credential into the key to everyone's activity. Both are compared in constant
# time and neither is ever logged, rendered in `Debug`, or returned in a body.
#
# `creationPolicy: Orphan` + `deletionPolicy: Retain` keep the materialized
# Secret alive when this binding is removed, so an operator experiment cannot
# take durable ingress down with it.
#
# Rotation of any of these four is an ordered, no-gap procedure — see
# AUDIT-RUNBOOK.md, "key rotation". The relay accepts exactly one write and one
# read token at a time by design (a bounded, constant-time comparison that cannot
# report which key matched), so the overlap lives in the ROLLOUT ORDER, not in a
# second accepted key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fkst-audit-relay
  namespace: chronoai-fkst
  labels:
    app.kubernetes.io/component: audit-relay
    app.kubernetes.io/name: fkst-audit-relay
    app.kubernetes.io/part-of: fkst-hosted
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: fkst-external-secrets
  target:
    name: fkst-audit-relay-secret
    creationPolicy: Orphan
    deletionPolicy: Retain
  # Explicit per-property references rather than `dataFrom.extract`: the relay
  # must receive exactly these four keys, and an operator who later adds an
  # unrelated value to the record must not have it appear in the relay's
  # environment by accident.
  data:
    - secretKey: FKST_AUDIT_RELAY_WRITE_TOKEN
      remoteRef:
        key: fkst-audit-relay
        property: FKST_AUDIT_RELAY_WRITE_TOKEN
    - secretKey: FKST_AUDIT_RELAY_READ_TOKEN
      remoteRef:
        key: fkst-audit-relay
        property: FKST_AUDIT_RELAY_READ_TOKEN
    - secretKey: FKST_POSTHOG_PROJECT_TOKEN
      remoteRef:
        key: fkst-audit-relay
        property: FKST_POSTHOG_PROJECT_TOKEN
    - secretKey: FKST_POSTHOG_QUERY_API_KEY
      remoteRef:
        key: fkst-audit-relay
        property: FKST_POSTHOG_QUERY_API_KEY
