# Identity for the durable audit relay.
#
# It is deliberately bound to NOTHING: no Role, no RoleBinding, no ClusterRole,
# and no mounted API token. The relay reads its configuration from environment
# variables, writes to one PVC, and talks to PostHog. It never calls the
# Kubernetes API — not even for its probes, which are plain HTTP against its own
# process — so any grant here would be reachable privilege that no code path
# needs (epic `OPS-03`).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fkst-audit-relay
  namespace: chronoai-fkst
  labels:
    app.kubernetes.io/component: audit-relay
    app.kubernetes.io/name: fkst-audit-relay
    app.kubernetes.io/part-of: fkst-hosted
automountServiceAccountToken: false
