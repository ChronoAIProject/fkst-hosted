apiVersion: v1
kind: Namespace
metadata:
  name: fkst-recovery-source
  labels:
    app.kubernetes.io/part-of: fkst-hosted
    fkst.chronoai.io/durability-boundary: external
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fkst-external-secrets-reader
  namespace: fkst-recovery-source
  labels:
    app.kubernetes.io/part-of: fkst-hosted
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fkst-external-secrets-reader
  namespace: chronoai-fkst
  labels:
    app.kubernetes.io/part-of: fkst-hosted
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fkst-external-secrets-reader
  namespace: opensandbox-system
  labels:
    app.kubernetes.io/part-of: fkst-hosted
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fkst-external-secrets-source-reader
  namespace: fkst-recovery-source
  labels:
    app.kubernetes.io/part-of: fkst-hosted
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fkst-control-plane-external-secrets
  namespace: fkst-recovery-source
  labels:
    app.kubernetes.io/part-of: fkst-hosted
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fkst-external-secrets-source-reader
subjects:
  - kind: ServiceAccount
    name: fkst-external-secrets-reader
    namespace: chronoai-fkst
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fkst-opensandbox-external-secrets
  namespace: fkst-recovery-source
  labels:
    app.kubernetes.io/part-of: fkst-hosted
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fkst-external-secrets-source-reader
subjects:
  - kind: ServiceAccount
    name: fkst-external-secrets-reader
    namespace: opensandbox-system
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: fkst-external-secrets
  namespace: chronoai-fkst
  labels:
    app.kubernetes.io/part-of: fkst-hosted
spec:
  provider:
    kubernetes:
      remoteNamespace: fkst-recovery-source
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: fkst-external-secrets-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: fkst-external-secrets
  namespace: opensandbox-system
  labels:
    app.kubernetes.io/part-of: fkst-hosted
spec:
  provider:
    kubernetes:
      remoteNamespace: fkst-recovery-source
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: fkst-external-secrets-reader
