apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - secrets
  - durable-store
patches:
  - target:
      version: v1
      kind: Namespace
      name: chronoai-fkst
    patch: |-
      - op: add
        path: /metadata/labels/fkst.chronoai.io~1disposable
        value: "true"
  - target:
      version: v1
      kind: ConfigMap
      name: fkst-control-plane-config
      namespace: chronoai-fkst
    patch: |-
      - op: add
        path: /data/FKST_ENV_STORE_NAMESPACE
        value: fkst-recovery-source
