apiVersion: apps/v1
kind: Deployment
metadata:
  name: fkst-frontend
  namespace: chronoai-fkst
  labels:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/name: fkst-frontend
    app.kubernetes.io/part-of: fkst-hosted
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fkst-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
        app.kubernetes.io/name: fkst-frontend
        app.kubernetes.io/part-of: fkst-hosted
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: frontend
          image: fkst-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
---
apiVersion: v1
kind: Service
metadata:
  name: fkst-frontend
  namespace: chronoai-fkst
  labels:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/name: fkst-frontend
    app.kubernetes.io/part-of: fkst-hosted
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: fkst-frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fkst-frontend
  namespace: chronoai-fkst
  labels:
    app.kubernetes.io/name: fkst-frontend
    app.kubernetes.io/part-of: fkst-hosted
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fkst-frontend
