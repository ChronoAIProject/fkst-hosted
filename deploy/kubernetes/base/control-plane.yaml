apiVersion: apps/v1
kind: Deployment
metadata:
  name: fkst-control-plane
  namespace: chronoai-fkst
  labels:
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/name: fkst-control-plane
    app.kubernetes.io/part-of: fkst-hosted
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fkst-control-plane
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/name: fkst-control-plane
        app.kubernetes.io/part-of: fkst-hosted
    spec:
      automountServiceAccountToken: true
      serviceAccountName: fkst-ksa
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fkst-control-plane
          image: fkst-control-plane:local
          imagePullPolicy: IfNotPresent
          env:
            - name: FKST_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: fkst-control-plane-config
            - secretRef:
                name: fkst-control-plane-secret
          ports:
            - containerPort: 8080
              name: http
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 2"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 7
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 7
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /var/lib/fkst/runtime
              name: runtime
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/secrets
              name: opensandbox-fkst-api-key
              readOnly: true
      volumes:
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: opensandbox-fkst-api-key
          secret:
            secretName: opensandbox-fkst-api-key
---
apiVersion: v1
kind: Service
metadata:
  name: fkst-control-plane
  namespace: chronoai-fkst
  labels:
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/name: fkst-control-plane
    app.kubernetes.io/part-of: fkst-hosted
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: fkst-control-plane
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fkst-control-plane
  namespace: chronoai-fkst
  labels:
    app.kubernetes.io/name: fkst-control-plane
    app.kubernetes.io/part-of: fkst-hosted
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fkst-control-plane
