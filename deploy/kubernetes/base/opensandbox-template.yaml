apiVersion: v1
kind: ConfigMap
metadata:
  name: opensandbox-batchsandbox-template
  namespace: opensandbox-system
  labels:
    app.kubernetes.io/component: sandbox-lifecycle
    app.kubernetes.io/part-of: fkst-hosted
data:
  batchsandbox-template.yaml: |
    metadata:
      labels:
        opensandbox.io/workload: sandbox
    spec:
      replicas: 1
      template:
        metadata:
          labels:
            opensandbox.io/workload: sandbox
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          serviceAccountName: sandbox-runner
          automountServiceAccountToken: false
          nodeSelector:
            sandbox.gke.io/runtime: gvisor
          tolerations:
            - key: sandbox.gke.io/runtime
              operator: Equal
              value: gvisor
              effect: NoSchedule
          securityContext:
            seccompProfile:
              type: RuntimeDefault
