apiVersion: v1
kind: ConfigMap
metadata:
  name: fkst-control-plane-config
  namespace: chronoai-fkst
  labels:
    app.kubernetes.io/name: fkst-control-plane
    app.kubernetes.io/part-of: fkst-hosted
data:
  FKST_HOSTED_LOG_LEVEL: info,fkst_control_plane=debug,tower_http=info
  FKST_HOSTED_REQUEST_TIMEOUT_SECS: "30"
  FKST_POD_DISPATCH: "true"
  FKST_POD_MODE: opensandbox
  FKST_POD_IMAGE: fkst-control-plane:local
  FKST_OSB_BASE_URL: http://opensandbox-server.opensandbox-system.svc.cluster.local
  FKST_OSB_API_KEY_FILE: /var/secrets/opensandbox-fkst-api-key
  FKST_OSB_ENTRYPOINT: /usr/local/bin/fkst-control-plane
  FKST_OSB_SESSION_CPU: "2"
  FKST_OSB_SESSION_MEMORY: 4Gi
  # Packages EVERY session receives, prepended to whatever its trigger declares.
  # Whitespace-separated owner/repo@ref:path. Unset/blank = feature off.
  #
  # This is what makes session isolation structural rather than author-dependent:
  # the rule lives in libraries/devloop, so a trigger declaring no devloop tree
  # would otherwise run with none. Four roots resolve to 13 packages via event_deps.
  #
  #   github-proxy    carries libraries/devloop (the isolation rule), and owns the
  #                   single read ingress (github_poll) plus every write egress.
  #                   Declared explicitly, not relied on transitively, so the
  #                   guarantee cannot be lost by another package dropping it.
  #   workflow-dev    core development (label fkst-dev): intake -> consensus ->
  #                   decompose -> implement -> PR -> integration -> ops.
  #   workflow-writer workflow authoring (label fkst-workflow): a request issue
  #                   yields a reviewable PR editing an fkst.workflow.v1 template.
  #                   Never consumes the dev intake seam, so it composes with
  #                   workflow-dev without contending for intake.
  #   idle-detector   cost control: emits system_idle so a session with no work
  #                   idles its pod down. In neither closure otherwise.
  #
  # NOTE: workflow-dev declares [github].work_labels = ["fkst-dev"], so every
  # session auto-declares fkst-dev and label sharing becomes the norm. That is the
  # intended model -- the sole assignee routes each work issue to one session --
  # and it makes the isolation gates load-bearing for every session.
  FKST_MANDATORY_PACKAGES: >-
    ChronoAIProject/fkst-hosted@packages:packages/github-proxy
    ChronoAIProject/fkst-hosted@packages:packages/workflow-dev
    ChronoAIProject/fkst-hosted@packages:packages/workflow-writer
    ChronoAIProject/fkst-hosted@packages:packages/idle-detector
  FKST_STARTUP_RESYNC_RETRY_INITIAL_SECS: "5"
  FKST_STARTUP_RESYNC_RETRY_MAX_SECS: "60"
  FKST_STARTUP_RESYNC_RETRY_JITTER_PERCENT: "20"
  FKST_LEADER_ELECTION_ENABLED: "true"
  FKST_LEADER_LEASE_NAME: fkst-control-plane-reconciler
  FKST_LEADER_LEASE_DURATION_SECS: "30"
  FKST_LEADER_RENEW_DEADLINE_SECS: "20"
  FKST_LEADER_RETRY_PERIOD_SECS: "5"
  FKST_LLM_BASE_URL: https://llm.example.invalid/v1
  FKST_LLM_MODEL: gpt-5.6-sol
  FKST_LLM_WIRE_API: responses
  # codex model_reasoning_effort for every session (minimal|low|medium|high|max;
  # default max). A trigger's `### Engine Config` may override the model and
  # effort per session (FKST_LLM_MODEL= / FKST_LLM_REASONING_EFFORT= lines).
  FKST_LLM_REASONING_EFFORT: "max"
  FKST_GITHUB_BOT_LOGIN: fkst-local[bot]
  # Exact issue-scoped cross-repository delivery exceptions. Production
  # overlays may replace this with a JSON array; the empty policy preserves the
  # default single-repository token and checkout scope.
  FKST_CROSS_REPO_DELIVERY_GRANTS: "[]"
  # Deployment access strategy (issue #3376): denylist — every authenticated
  # GitHub user may use the service EXCEPT those named in
  # FKST_ACCESS_BLOCKED_USERS (comma-separated logins; @ tolerated,
  # case-insensitive; numeric ids remain the rename-safe alternative). Leave
  # the blocklist unset/blank to block nobody; FKST_GLOBAL_ADMINS always pass.
  # Config is read at startup — rollout-restart the control plane after edits.
  # OVERLAY CAUTION: an explicit model IGNORES the other model's list. An
  # overlay that sets FKST_ACCESS_ALLOWED_USERS while inheriting this denylist
  # default gets NO enforcement from it (the pod logs a startup WARN) — such an
  # overlay must also override FKST_AUTH_MODEL (e.g. to "allowlist").
  FKST_AUTH_MODEL: denylist
  # FKST_ACCESS_BLOCKED_USERS: "<blocked-github-login>, <another-login>"
  FKST_PUBLIC_BASE_URL: https://api.chronoai-fkst.local
  FKST_FRONTEND_URL: https://app.chronoai-fkst.local
  # ---- chat concierge (POST /api/v1/chat) ----
  # Dark by default, matching the feature's own fail-closed contract: with
  # FKST_CHAT_ENABLED unset/false the route is neither served nor documented and
  # no other FKST_CHAT_* value is read or validated. An environment overlay opts
  # in, so enabling the surface is always a deliberate per-deployment act rather
  # than something a base-manifest bump switches on everywhere.
  #
  # Every knob below falls back to the session engine's FKST_LLM_* value, so a
  # deployment that wants chat on the same provider sets only ENABLED. Override
  # BASE_URL / API_KEY / MODEL to point chat at a cheaper or faster model.
  FKST_CHAT_ENABLED: "false"
  # FKST_CHAT_MODEL: <model id; defaults to FKST_LLM_MODEL>
  # FKST_CHAT_MAX_TOOL_ITERATIONS: "8"
  # FKST_CHAT_TURN_DEADLINE_SECS: "120"
  # FKST_CHAT_MAX_CONCURRENT_TURNS: "4"
  # FKST_CHAT_HISTORY_MAX_MESSAGES: "40"
  # FKST_CHAT_REQUEST_MAX_BYTES: "262144"
  # Per-frame cap on the step timeline's tool arguments and tool response. Unset/0
  # is UNLIMITED, so the timeline a user expands is a complete record of what was
  # sent and returned. Set a byte value to bound large frames; the payload is then
  # truncated and the frame flags it, while the model still receives the whole
  # result either way.
  # FKST_CHAT_DETAIL_MAX_BYTES: "0"
