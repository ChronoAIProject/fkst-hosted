apiVersion: v1
kind: ConfigMap
metadata:
  name: fkst-control-plane-config
  namespace: chronoai-fkst
  labels:
    app.kubernetes.io/name: fkst-control-plane
    app.kubernetes.io/part-of: fkst-hosted
data:
  FKST_HOSTED_LOG_LEVEL: info,fkst_control_plane=debug,tower_http=info
  FKST_HOSTED_REQUEST_TIMEOUT_SECS: "30"
  FKST_POD_DISPATCH: "true"
  FKST_POD_MODE: opensandbox
  FKST_POD_IMAGE: fkst-control-plane:local
  FKST_OSB_BASE_URL: http://opensandbox-server.opensandbox-system.svc.cluster.local
  FKST_OSB_API_KEY_FILE: /var/secrets/opensandbox-fkst-api-key
  FKST_OSB_ENTRYPOINT: /usr/local/bin/fkst-control-plane
  FKST_OSB_SESSION_CPU: "2"
  FKST_OSB_SESSION_MEMORY: 4Gi
  FKST_STARTUP_RESYNC_RETRY_INITIAL_SECS: "5"
  FKST_STARTUP_RESYNC_RETRY_MAX_SECS: "60"
  FKST_STARTUP_RESYNC_RETRY_JITTER_PERCENT: "20"
  FKST_LEADER_ELECTION_ENABLED: "true"
  FKST_LEADER_LEASE_NAME: fkst-control-plane-reconciler
  FKST_LEADER_LEASE_DURATION_SECS: "30"
  FKST_LEADER_RENEW_DEADLINE_SECS: "20"
  FKST_LEADER_RETRY_PERIOD_SECS: "5"
  FKST_LLM_BASE_URL: https://llm.example.invalid/v1
  FKST_LLM_MODEL: gpt-5.6-sol
  FKST_LLM_WIRE_API: responses
  # codex model_reasoning_effort for every session (minimal|low|medium|high|max;
  # default max). A trigger's `### Engine Config` may override the model and
  # effort per session (FKST_LLM_MODEL= / FKST_LLM_REASONING_EFFORT= lines).
  FKST_LLM_REASONING_EFFORT: "max"
  FKST_GITHUB_BOT_LOGIN: fkst-local[bot]
  # Exact issue-scoped cross-repository delivery exceptions. Production
  # overlays may replace this with a JSON array; the empty policy preserves the
  # default single-repository token and checkout scope.
  FKST_CROSS_REPO_DELIVERY_GRANTS: "[]"
  # Deployment access strategy (issue #3376): denylist — every authenticated
  # GitHub user may use the service EXCEPT those named in
  # FKST_ACCESS_BLOCKED_USERS (comma-separated logins; @ tolerated,
  # case-insensitive; numeric ids remain the rename-safe alternative). Leave
  # the blocklist unset/blank to block nobody; FKST_GLOBAL_ADMINS always pass.
  # Config is read at startup — rollout-restart the control plane after edits.
  # OVERLAY CAUTION: an explicit model IGNORES the other model's list. An
  # overlay that sets FKST_ACCESS_ALLOWED_USERS while inheriting this denylist
  # default gets NO enforcement from it (the pod logs a startup WARN) — such an
  # overlay must also override FKST_AUTH_MODEL (e.g. to "allowlist").
  FKST_AUTH_MODEL: denylist
  # FKST_ACCESS_BLOCKED_USERS: "<blocked-github-login>, <another-login>"
  FKST_PUBLIC_BASE_URL: https://api.chronoai-fkst.local
  FKST_FRONTEND_URL: https://app.chronoai-fkst.local
  # ---- chat concierge (POST /api/v1/chat) ----
  # Dark by default, matching the feature's own fail-closed contract: with
  # FKST_CHAT_ENABLED unset/false the route is neither served nor documented and
  # no other FKST_CHAT_* value is read or validated. An environment overlay opts
  # in, so enabling the surface is always a deliberate per-deployment act rather
  # than something a base-manifest bump switches on everywhere.
  #
  # Every knob below falls back to the session engine's FKST_LLM_* value, so a
  # deployment that wants chat on the same provider sets only ENABLED. Override
  # BASE_URL / API_KEY / MODEL to point chat at a cheaper or faster model.
  FKST_CHAT_ENABLED: "false"
  # FKST_CHAT_MODEL: <model id; defaults to FKST_LLM_MODEL>
  # FKST_CHAT_MAX_TOOL_ITERATIONS: "8"
  # FKST_CHAT_TURN_DEADLINE_SECS: "120"
  # FKST_CHAT_MAX_CONCURRENT_TURNS: "4"
  # FKST_CHAT_HISTORY_MAX_MESSAGES: "40"
  # FKST_CHAT_REQUEST_MAX_BYTES: "262144"
  # Per-frame cap on the step timeline's tool arguments and tool response. Unset/0
  # is UNLIMITED, so the timeline a user expands is a complete record of what was
  # sent and returned. Set a byte value to bound large frames; the payload is then
  # truncated and the frame flags it, while the model still receives the whole
  # result either way.
  # FKST_CHAT_DETAIL_MAX_BYTES: "0"
  # ---- user activity trace (PostHog capture sink) ----
  # Dark by default, like the chat block above: with FKST_POSTHOG_ENABLED
  # unset/false the control plane installs the no-op sink, starts no delivery
  # worker, and makes no network call, so every other FKST_POSTHOG_* value is
  # inert. An environment overlay opts in, so deployment-wide capture is always
  # a deliberate per-deployment act rather than something a base bump switches
  # on everywhere.
  #
  # The project (write) token is a SECRET: it belongs in the
  # fkst-control-plane-secret record as FKST_POSTHOG_PROJECT_TOKEN, never here.
  # The host is required when enabled, must be https outside an explicitly
  # test/local FKST_DEPLOYMENT_ENVIRONMENT, and may never embed userinfo
  # credentials — that is refused at startup whether the feature is on or off.
  #
  # The numeric knobs are validated even while disabled, so a typo fails the
  # deploy that introduces it rather than the one that flips the feature on.
  FKST_POSTHOG_ENABLED: "false"
  # FKST_POSTHOG_HOST: <https base url of the self-hosted PostHog>
  # FKST_POSTHOG_CAPTURE_TIMEOUT_MS: "2000"
  # FKST_POSTHOG_BATCH_SIZE: "100"
  # FKST_POSTHOG_FLUSH_INTERVAL_MS: "1000"
  # FKST_POSTHOG_QUEUE_CAPACITY: "10000"
  # FKST_POSTHOG_MAX_RETRIES: "5"
  # FKST_POSTHOG_RETRY_INITIAL_MS: "100"
  # FKST_POSTHOG_RETRY_MAX_MS: "5000"
  # FKST_POSTHOG_SHUTDOWN_FLUSH_SECS: "10"
  # FKST_POSTHOG_MAX_EVENT_BYTES: "65536"
  # Deployment environment name stamped on every audit event, and the switch
  # that permits a plaintext http:// PostHog host (only "test"/"local" do).
  # Deliberately UNSET in base: a value inherited from here would silently relax
  # that HTTPS gate for any overlay that forgot to patch it, so each environment
  # overlay sets its own.
  # FKST_DEPLOYMENT_ENVIRONMENT: <production|staging|local|test>
  # ---- audit delivery (the durable relay) ----
  # THIS IS THE NON-PRODUCTION DEFAULT. `disabled` makes no relay call at all:
  # delivery is whatever the capture sink above is configured to be, which
  # preserves the behaviour of a deployment that has not adopted the relay.
  #
  #   disabled     no relay call. Base and local default.
  #   best_effort  the relay is called; a failure is counted, logged, and then
  #                IGNORED, and the record falls back to the local sink. Never
  #                changes a response. This is the SHADOW mode of the staged
  #                rollout, and the documented incident rollback target.
  #   required     production. The start must be durably acknowledged BEFORE the
  #                handler runs and the terminal event committed before the
  #                response is released; failures become 503s.
  #
  # `overlays/required-audit/` is the reference production composition. Moving
  # from `required` back to `best_effort` is an explicit, alerted operator
  # action (see AUDIT-RUNBOOK.md) — never a silent automatic fallback.
  FKST_AUDIT_DELIVERY_MODE: disabled
  # In-cluster address of the relay Service from `audit-relay/`. Set even while
  # the mode is `disabled` so adopting the relay is a one-key patch; it is
  # validated (http(s), host present, no embedded userinfo) either way, and
  # unused until the mode changes.
  FKST_AUDIT_RELAY_URL: http://fkst-audit-relay.chronoai-fkst.svc.cluster.local
  # SHARED with the relay's own ConfigMap — the two MUST carry the same value.
  # The control plane writes `completion_deadline_at = started_at + grace`; the
  # relay closes a start as `incomplete` at `completion_deadline_at + grace`.
  # It must outlast the LONGEST audited request (the `/api/v1` subtree ceiling,
  # FKST_ENV_VALIDATE_DEADLINE_SECS + 60s) plus a 30s clock-skew margin, or the
  # relay force-closes a request that is still running and required mode returns
  # a 503 for work that succeeded. The control plane refuses to boot on a value
  # that does not cover it, so raising FKST_ENV_VALIDATE_DEADLINE_SECS means
  # raising this in BOTH ConfigMaps.
  FKST_AUDIT_INCOMPLETE_GRACE_SECS: "420"
  # Pre-handler acknowledgement budget: every audited request pays it before its
  # handler runs, so it is deliberately short.
  # FKST_AUDIT_RELAY_START_TIMEOUT_MS: "1000"
  # Completion budget: the response is held until it elapses.
  # FKST_AUDIT_RELAY_COMPLETION_TIMEOUT_MS: "5000"
  #
  # The relay's WRITE and READ tokens are SECRETS delivered through the
  # fkst-control-plane record (FKST_AUDIT_RELAY_WRITE_TOKEN /
  # FKST_AUDIT_RELAY_READ_TOKEN). They never appear here.
  # ---- activity query (GET /api/v1/operations/activity) ----
  # The read side of the trace. The numeric project id is NOT a secret (it is in
  # every PostHog project URL); the Query-Read-only key that goes with it is, and
  # is delivered as FKST_POSTHOG_QUERY_API_KEY in the control-plane secret
  # record. Without both, the activity API reports itself unconfigured instead of
  # returning an apparently complete empty result.
  # FKST_POSTHOG_PROJECT_ID: <numeric project id from the PostHog project URL>
  # FKST_POSTHOG_QUERY_TIMEOUT_MS: "5000"
  # FKST_POSTHOG_ACTIVITY_DEFAULT_LIMIT: "100"
  # FKST_POSTHOG_ACTIVITY_MAX_LIMIT: "200"
  # FKST_POSTHOG_ACTIVITY_MAX_RANGE_DAYS: "30"
  # ---- live sandbox inventory (GET /api/v1/operations/sandboxes) ----
  # Independent of PostHog by design: a capture or query outage must never hide
  # live runtime state, and a runtime-backend outage must never falsify history.
  # FKST_OPERATIONS_SANDBOX_MAX_RESULT_ITEMS: "5000"
  # FKST_OPERATIONS_SANDBOX_TIMEOUT_MS: "5000"
  # FKST_SANDBOX_INVENTORY_MAX_SOURCE_ITEMS: "5000"
  # FKST_SANDBOX_INVENTORY_MAX_WARNINGS: "256"
