# fkst-frontend nginx site config (copied into the image as the default site).
#
# The SPA contract: every non-file path falls back to index.html so
# react-router owns deep links (/get-started, /dashboard, ...). Hashed build
# assets are immutable-cached; index.html is never cached so a redeploy is
# picked up on the next load.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames under /assets/ — safe to cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry document must always revalidate, or clients keep referencing
    # hashed assets from a previous deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths render the app shell (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
