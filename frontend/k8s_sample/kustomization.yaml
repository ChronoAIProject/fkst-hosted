# Kustomize entry point for the fkst-frontend SAMPLE manifests. Deploy into the
# same namespace as the backend (see backend/k8s_sample/namespace.yaml) so the
# shared ingress can front both services:
#   kubectl apply -n <ns> -k frontend/k8s_sample
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: fkst-frontend
    newTag: dev
