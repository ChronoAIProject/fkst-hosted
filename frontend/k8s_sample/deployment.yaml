# fkst-frontend Deployment — SAMPLE values (adapt image/replicas per cluster).
# The container is a plain nginx serving the built SPA; all state lives in the
# backend, so this scales horizontally without coordination.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fkst-frontend
  labels:
    app.kubernetes.io/name: fkst-frontend
    app.kubernetes.io/part-of: fkst-hosted
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fkst-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fkst-frontend
        app.kubernetes.io/part-of: fkst-hosted
    spec:
      containers:
        - name: frontend
          # Built from frontend/Dockerfile. Empty VITE_FKST_API_BASE (the
          # default) = same-origin API — correct when the ingress below fronts
          # both this and the fkst-control-plane service.
          image: fkst-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
