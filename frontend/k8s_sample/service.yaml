# fkst-frontend Service (ClusterIP; the ingress terminates external traffic).
# Local access: kubectl -n <ns> port-forward svc/fkst-frontend 3000:80
apiVersion: v1
kind: Service
metadata:
  name: fkst-frontend
  labels:
    app.kubernetes.io/name: fkst-frontend
    app.kubernetes.io/part-of: fkst-hosted
spec:
  selector:
    app.kubernetes.io/name: fkst-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
