name: Rust CI

on:
  pull_request:
    branches: [develop, develop-auto, feat/local-qa-runtime]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: rust lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show && rustup component add rustfmt clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            apps/local-qa-runtime
      - name: rustfmt --check
        run: cargo fmt --all -- --check
      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Local QA Runtime rustfmt --check
        working-directory: apps/local-qa-runtime
        run: cargo fmt --all -- --check
      - name: Local QA Runtime clippy -D warnings
        working-directory: apps/local-qa-runtime
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/qa-contracts/package-lock.json
      - name: Install QA contracts
        working-directory: packages/qa-contracts
        run: npm ci --ignore-scripts
      - name: Type-check QA contracts
        working-directory: packages/qa-contracts
        run: npm run --ignore-scripts typecheck

  build:
    name: rust build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add aarch64-apple-darwin x86_64-pc-windows-msvc
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            apps/local-qa-runtime
      - name: build
        run: cargo build --workspace --locked
      - name: Build Local QA Runtime
        working-directory: apps/local-qa-runtime
        run: cargo build --workspace --locked
      - name: Check Local QA Runtime macOS target
        working-directory: apps/local-qa-runtime
        run: cargo check --workspace --all-targets --locked --target aarch64-apple-darwin
      - name: Check Local QA Runtime Windows target
        working-directory: apps/local-qa-runtime
        run: cargo check --workspace --all-targets --locked --target x86_64-pc-windows-msvc
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/local-qa-runtime/workers/package-lock.json
            packages/qa-contracts/package-lock.json
      - name: Install QA contracts
        working-directory: packages/qa-contracts
        run: npm ci --ignore-scripts
      - name: Build QA contracts
        working-directory: packages/qa-contracts
        run: npm run --ignore-scripts build
      - name: Install Local QA workers
        working-directory: apps/local-qa-runtime/workers
        run: npm ci --ignore-scripts
      - name: Type-check Local QA workers
        working-directory: apps/local-qa-runtime/workers
        run: npm run --ignore-scripts typecheck
      - name: Build Local QA workers
        working-directory: apps/local-qa-runtime/workers
        run: npm run --ignore-scripts build
      - name: Verify inert Local QA scaffold
        working-directory: .
        run: bash apps/local-qa-runtime/tests/scaffold-structure.sh

  test:
    name: rust test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            apps/local-qa-runtime
      - name: test
        run: cargo test --workspace --locked
      - name: Test Local QA Runtime
        working-directory: apps/local-qa-runtime
        run: cargo test --workspace --locked -- --nocapture
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/qa-contracts/package-lock.json
      - name: Install QA contracts
        working-directory: packages/qa-contracts
        run: npm ci --ignore-scripts
      - name: Test QA contracts
        working-directory: packages/qa-contracts
        run: npm run --ignore-scripts test
