name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      substrate_ref:
        description: "fkst-substrate ref to build fkst-framework from"
        default: dev
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fkst-packages
        uses: actions/checkout@v4

      # fkst-framework is built from the sibling engine repo. It is public, so no
      # token is needed. Default to its dev branch; override via workflow_dispatch.
      - name: Checkout fkst-substrate
        uses: actions/checkout@v4
        with:
          repository: ChronoAIProject/fkst-substrate
          ref: ${{ github.event.inputs.substrate_ref || 'dev' }}
          path: fkst-substrate

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fkst-substrate

      - name: Build fkst-framework
        working-directory: fkst-substrate
        run: cargo build -p fkst-framework

      - name: Run repository checks and package tests
        env:
          BIN: ${{ github.workspace }}/fkst-substrate/target/debug/fkst-framework
        run: |
          test -x "$BIN"
          scripts/run.sh test
