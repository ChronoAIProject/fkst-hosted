[workspace]
# The current engine consumes `units`; `packages` and `libraries` keep the
# workspace split explicit for the library-dependency contract.
units = ["packages/*", "libraries/*"]
packages = ["packages/*"]
libraries = ["libraries/*"]

[registries]
workspace = "workspace"

[[package]]
name = "github-devloop"
source = "workspace"
version = "workspace"

